    <script type="module">
      import React, { useCallback, useEffect, useMemo, useRef, useState } from "react";
      import { createRoot } from "react-dom/client";
      import {
        Bar,
        BarChart,
        CartesianGrid,
        Cell,
        ReferenceLine,
        ResponsiveContainer,
        Tooltip,
        XAxis,
        YAxis,
      } from "recharts";
      import {
        Activity,
        AlertTriangle,
        Clock,
        Cpu,
        Crosshair,
        Database,
        Flame,
        FlaskConical,
        Grid,
        Hash,
        History,
        Minus,
        Pause,
        Play,
        PlayCircle,
        Plug,
        PlugZap,
        Radar,
        RefreshCw,
        Repeat,
        Search,
        ShieldCheck,
        ShieldOff,
        SlidersHorizontal,
        Snowflake,
        Star,
        Terminal,
        Trash2,
      } from "lucide-react";

      const h = React.createElement;

      // =========================================================================
      // STAGE 1-2: CONSTANTS & ENDPOINTS
      // =========================================================================
      const PUBLIC_OPTIONS_WS = "wss://api.derivws.com/trading/v1/options/ws/public";
      const LEGACY_V3_WS_BASE = "wss://ws.derivws.com/websockets/v3";
      const DEFAULT_APP_ID = 3496;
      const DEFAULT_SCANNER_INTERVAL_MS = 12000;
      const STALE_THRESHOLD_MS = 10000;
      const SUPPORTED_WINDOWS = [25, 50, 100, 200, 500, 1000];

      const PREFERRED_1S = ["1HZ10V", "1HZ25V", "1HZ50V", "1HZ75V", "1HZ100V"];
      const PREFERRED_STD = ["R_10", "R_25", "R_50", "R_75", "R_100"];
      const INITIAL_SYMBOLS = [...PREFERRED_1S, ...PREFERRED_STD];

      function computeBackoffMs(attempt, baseMs = 800, maxMs = 25000) {
        const exp = Math.min(maxMs, baseMs * Math.pow(2, Math.max(0, attempt)));
        return Math.round(exp * 0.5 + exp * 0.5 * Math.random());
      }

      // =========================================================================
      // STAGE 3: PRECISION-SAFE DIGIT EXTRACTION & TICK NORMALIZATION
      // =========================================================================
      function inferDecimalsFromPip(pipSize) {
        if (typeof pipSize !== "number" || !Number.isFinite(pipSize) || pipSize <= 0) {
          return null;
        }
        const s = pipSize.toString();
        if (s.includes("e") || s.includes("E")) {
          const m = s.match(/e([+-]?\d+)$/i);
          if (!m) return null;
          const exp = Number(m[1]);
          const sig = s.split(/e/i)[0] || "";
          const fracLen = sig.includes(".") ? sig.split(".")[1].length : 0;
          return Math.max(0, fracLen - exp);
        }
        const parts = s.split(".");
        return parts.length === 2 ? parts[1].length : 0;
      }

      function normalizeDecimalString(rawQuote, decimals) {
        const trimmed = String(rawQuote).trim();
        const neg = trimmed.startsWith("-");
        const unsigned = trimmed.replace(/^[+-]/, "");
        const [rawInt = "0", rawFrac = ""] = unsigned.split(".");
        const intPart = rawInt.length > 0 ? rawInt.replace(/^0+(?=\d)/, "") : "0";
        if (decimals <= 0) return `${neg ? "-" : ""}${intPart}`;
        const frac = rawFrac.length >= decimals ? rawFrac.slice(0, decimals) : rawFrac.padEnd(decimals, "0");
        return `${neg ? "-" : ""}${intPart}.${frac}`;
      }

      function extractLastDigit(quoteInput, meta = {}) {
        const rawStr = typeof quoteInput === "number" ? quoteInput.toString() : String(quoteInput ?? "").trim();
        if (!rawStr || !/^[+-]?(?:\d+\.?\d*|\.\d+)$/.test(rawStr) || !Number.isFinite(Number(rawStr))) {
          return { digit: null, formattedPrice: rawStr, isValid: false, warning: "Invalid quote" };
        }
        const explicitDec =
          typeof meta.displayDecimals === "number" && Number.isInteger(meta.displayDecimals) && meta.displayDecimals >= 0
            ? meta.displayDecimals
            : null;
        const pipDec = inferDecimalsFromPip(meta.pipSize);
        const resolvedDec = explicitDec ?? pipDec;

        if (resolvedDec !== null) {
          const norm = normalizeDecimalString(rawStr, resolvedDec);
          const d = Number(norm.charAt(norm.length - 1));
          return {
            digit: Number.isInteger(d) && d >= 0 && d <= 9 ? d : null,
            formattedPrice: norm,
            isValid: Number.isInteger(d) && d >= 0 && d <= 9,
            warning: null,
          };
        }

        if (rawStr.includes(".")) {
          const frac = rawStr.split(".")[1] || "";
          if (frac.length > 0) {
            const d = Number(frac.charAt(frac.length - 1));
            return {
              digit: Number.isInteger(d) && d >= 0 && d <= 9 ? d : null,
              formattedPrice: rawStr,
              isValid: Number.isInteger(d) && d >= 0 && d <= 9,
              warning: "Missing pip_size/display_decimals metadata; using quote decimal fallback",
            };
          }
        }

        return {
          digit: null,
          formattedPrice: rawStr,
          isValid: false,
          warning: "Missing precision metadata",
        };
      }

      function normalizeSymbols(rawResponse) {
        const list = rawResponse && Array.isArray(rawResponse.active_symbols) ? rawResponse.active_symbols : [];
        const prefSet = new Set(INITIAL_SYMBOLS);
        const out = [];
        for (const item of list) {
          if (!item || typeof item !== "object") continue;
          const sym = item.underlying_symbol || item.symbol;
          if (!sym) continue;
          const pipSize = typeof item.pip_size === "number" ? item.pip_size : typeof item.pip === "number" ? item.pip : null;
          const displayDecimals = typeof item.display_decimals === "number" ? item.display_decimals : null;
          const hasPrecisionWarning = pipSize === null && displayDecimals === null;
          out.push({
            symbol: String(sym),
            name: String(item.underlying_symbol_name || item.display_name || sym),
            category: String(item.market || "synthetic"),
            pipSize,
            displayDecimals,
            isPreferred: prefSet.has(String(sym)),
            hasPrecisionWarning,
            precisionWarningReason: hasPrecisionWarning ? "Missing pip_size / display_decimals" : undefined,
          });
        }
        return out;
      }

      function parseInboundTick(payload, meta, fallbackSymbol) {
        if (!payload || typeof payload !== "object" || !payload.tick) return null;
        const t = payload.tick;
        const symbol = t.symbol || fallbackSymbol;
        if (!symbol) return null;
        const quoteStr = typeof t.quote === "string" ? t.quote.trim() : Number.isFinite(t.quote) ? String(t.quote) : "";
        const quoteNum = Number(quoteStr);
        if (!quoteStr || !Number.isFinite(quoteNum)) return null;
        const rawEpoch = typeof t.epoch === "number" ? t.epoch : Number(t.epoch);
        if (!Number.isFinite(rawEpoch) || rawEpoch <= 0) return null;
        const epochMs = rawEpoch < 1e12 ? Math.round(rawEpoch * 1000) : Math.round(rawEpoch);
        const ext = extractLastDigit(quoteStr, {
          pipSize: t.pip_size ?? meta?.pipSize ?? null,
          displayDecimals: meta?.displayDecimals ?? null,
        });
        if (!ext.isValid || ext.digit === null) return null;
        return {
          symbol: String(symbol),
          quoteStr,
          quoteNum,
          digit: ext.digit,
          epochMs,
          tickId: t.id ? String(t.id) : undefined,
          subscriptionId: payload.subscription?.id ? String(payload.subscription.id) : undefined,
          dataQualityWarning: ext.warning || undefined,
        };
      }

      // =========================================================================
      // STAGE 4: FREQUENCY, HOT/COLD/OVERDUE, MARKOV, PATTERNS & STATS ENGINES
      // =========================================================================
      function sliceDigits(ticks, windowSize) {
        const clean = [];
        for (const t of ticks || []) {
          if (t && typeof t.digit === "number" && Number.isInteger(t.digit) && t.digit >= 0 && t.digit <= 9) {
            clean.push(t.digit);
          }
        }
        return clean.length > windowSize ? clean.slice(-windowSize) : clean;
      }

      function analyzeFrequency(symbol, ticks, windowSize, nowMs = Date.now()) {
        const digits = sliceDigits(ticks, windowSize);
        const n = digits.length;
        const expectedCount = n * 0.1;
        const hotDigits = [];
        const coldDigits = [];
        const overdueDigits = [];
        const neutralDigits = [];

        const items = [];
        for (let d = 0; d <= 9; d++) {
          let count = 0;
          let lastIdx = null;
          const hitIndices = [];
          for (let i = 0; i < n; i++) {
            if (digits[i] === d) {
              count += 1;
              lastIdx = i;
              hitIndices.push(i);
            }
          }
          const frequencyPct = n > 0 ? Number(((count / n) * 100).toFixed(2)) : 0;
          const deviationPct = Number((frequencyPct - 10).toFixed(2));
          const relDev = expectedCount > 0 ? (count - expectedCount) / expectedCount : 0;
          const ticksSinceLastOccurrence = lastIdx !== null ? n - 1 - lastIdx : null;

          let avgGap = null;
          if (hitIndices.length >= 2) {
            let sumGap = 0;
            for (let k = 1; k < hitIndices.length; k++) sumGap += hitIndices[k] - hitIndices[k - 1];
            avgGap = Number((sumGap / (hitIndices.length - 1)).toFixed(2));
          }

          let run = 0;
          let longestStreak = 0;
          for (const val of digits) {
            if (val === d) {
              run += 1;
              if (run > longestStreak) longestStreak = run;
            } else {
              run = 0;
            }
          }
          let currentStreak = 0;
          for (let i = n - 1; i >= 0; i--) {
            if (digits[i] === d) currentStreak += 1;
            else break;
          }

          let classification = "NEUTRAL";
          let classificationReason = `Digit ${d} within nominal variance around 10% uniform baseline.`;
          const overdueThreshold = Math.max(12, Math.round((avgGap ?? 10) * 1.8));
          const isOverdue =
            n >= 20 && (ticksSinceLastOccurrence === null ? n >= 30 : ticksSinceLastOccurrence >= overdueThreshold);

          if (n >= 20 && isOverdue) {
            classification = "OVERDUE";
            classificationReason =
              ticksSinceLastOccurrence === null
                ? `Digit ${d} unseen in last ${n} ticks (past gap only; not a guarantee of next draw).`
                : `Digit ${d} absent for ${ticksSinceLastOccurrence} ticks (threshold >= ${overdueThreshold}; not a guarantee of next draw).`;
            overdueDigits.push(d);
          } else if (n >= 20 && relDev >= 0.25 && count >= 3) {
            classification = "HOT";
            classificationReason = `Digit ${d} at ${frequencyPct}% (${deviationPct >= 0 ? "+" : ""}${deviationPct}% vs 10% baseline).`;
            hotDigits.push(d);
          } else if (n >= 20 && relDev <= -0.25) {
            classification = "COLD";
            classificationReason = `Digit ${d} at ${frequencyPct}% (${deviationPct}% vs 10% baseline).`;
            coldDigits.push(d);
          } else {
            neutralDigits.push(d);
          }

          items.push({
            digit: d,
            count,
            frequencyPct,
            deviationPct,
            ticksSinceLastOccurrence,
            avgGap,
            currentStreak,
            longestStreak,
            classification,
            classificationReason,
          });
        }

        return {
          symbol,
          windowSize,
          requestedWindowSize: windowSize,
          sampleSize: n,
          digits: items,
          hotDigits,
          coldDigits,
          overdueDigits,
          neutralDigits,
          epistemicCaveat:
            "Hot, Cold, and Overdue labels reflect historical sample statistics against a 10% uniform reference—never guaranteed future outcomes.",
          computedAt: nowMs,
        };
      }

      function analyzeMarkov(symbol, ticks, windowSize, nowMs = Date.now()) {
        const digits = sliceDigits(ticks, windowSize);
        const totalTransitions = Math.max(0, digits.length - 1);
        const counts = Array.from({ length: 10 }, () => Array(10).fill(0));
        for (let i = 0; i < digits.length - 1; i++) {
          counts[digits[i]][digits[i + 1]] += 1;
        }
        const flat = [];
        const matrix = counts.map((row, fromDigit) => {
          const rowSum = row.reduce((a, b) => a + b, 0);
          return row.map((count, toDigit) => {
            const conditionalProbability = rowSum > 0 ? Number((count / rowSum).toFixed(4)) : 0;
            const cell = {
              fromDigit,
              toDigit,
              count,
              conditionalProbability,
              sharePct: totalTransitions > 0 ? Number(((count / totalTransitions) * 100).toFixed(2)) : 0,
            };
            flat.push(cell);
            return cell;
          });
        });

        const mostFrequentTransitions = [...flat].sort((a, b) => b.count - a.count).slice(0, 6);
        const sufficientCells = flat.filter((c) => c.count >= 5).length;

        return {
          symbol,
          windowSize,
          sampleSize: digits.length,
          totalTransitions,
          matrix,
          mostFrequentTransitions,
          sampleSufficiencyRatio: Number((sufficientCells / 100).toFixed(3)),
          multiWindowConsistency: digits.length >= 20 ? 0.72 : 0.25,
          computedAt: nowMs,
        };
      }

      function analyzePatterns(symbol, ticks, windowSize, nowMs = Date.now()) {
        const digits = sliceDigits(ticks, windowSize);
        const n = digits.length;
        let repeatedImmediateCount = 0;
        let runLen = n > 0 ? 1 : 0;
        let maxConsecutiveRunLength = n > 0 ? 1 : 0;
        for (let i = 1; i < n; i++) {
          if (digits[i] === digits[i - 1]) {
            repeatedImmediateCount += 1;
            runLen += 1;
            if (runLen > maxConsecutiveRunLength) maxConsecutiveRunLength = runLen;
          } else {
            runLen = 1;
          }
        }

        let alternatingPatternCount = 0;
        for (let i = 0; i <= n - 4; i++) {
          if (digits[i] !== digits[i + 1] && digits[i] === digits[i + 2] && digits[i + 1] === digits[i + 3]) {
            alternatingPatternCount += 1;
          }
        }

        const oddCount = digits.filter((d) => d % 2 !== 0).length;
        const evenCount = n - oddCount;
        const highCount = digits.filter((d) => d >= 5).length;
        const lowCount = n - highCount;

        const seqMap = new Map();
        for (let i = 0; i <= n - 2; i++) {
          const key = `${digits[i]}-${digits[i + 1]}`;
          seqMap.set(key, (seqMap.get(key) || 0) + 1);
        }
        const repeatedShortSequences = Array.from(seqMap.entries())
          .filter(([, c]) => c >= 2)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 6)
          .map(([pattern, occurrences]) => ({ pattern, occurrences }));

        let transitionClusterCount = 0;
        for (let i = 0; i <= n - 5; i++) {
          let repeats = 0;
          for (let j = i + 1; j < i + 5; j++) if (digits[j] === digits[j - 1]) repeats += 1;
          if (repeats >= 2) transitionClusterCount += 1;
        }

        return {
          symbol,
          windowSize,
          sampleSize: n,
          repeatedImmediateCount,
          maxConsecutiveRunLength,
          alternatingPatternCount,
          oddPct: n > 0 ? Number(((oddCount / n) * 100).toFixed(1)) : 0,
          evenPct: n > 0 ? Number(((evenCount / n) * 100).toFixed(1)) : 0,
          highPct: n > 0 ? Number(((highCount / n) * 100).toFixed(1)) : 0,
          lowPct: n > 0 ? Number(((lowCount / n) * 100).toFixed(1)) : 0,
          repeatedShortSequences,
          transitionClusterCount,
          computedAt: nowMs,
        };
      }

      function wilsonCI(successes, trials, z = 1.96) {
        if (trials <= 0) return { proportion: 0, lower: 0, upper: 0 };
        const p = successes / trials;
        const z2 = z * z;
        const denom = 1 + z2 / trials;
        const center = (p + z2 / (2 * trials)) / denom;
        const margin = (z * Math.sqrt((p * (1 - p) + z2 / (4 * trials)) / trials)) / denom;
        return {
          proportion: Number(p.toFixed(4)),
          lower: Number(Math.max(0, center - margin).toFixed(4)),
          upper: Number(Math.min(1, center + margin).toFixed(4)),
        };
      }

      function computeAutocorrelation(arr, lag) {
        if (arr.length <= lag) return 0;
        const n = arr.length;
        const mean = arr.reduce((a, b) => a + b, 0) / n;
        let num = 0;
        let den = 0;
        for (let i = 0; i < n; i++) {
          const diff = arr[i] - mean;
          den += diff * diff;
          if (i + lag < n) num += diff * (arr[i + lag] - mean);
        }
        return den === 0 ? 0 : Number((num / den).toFixed(4));
      }

      function runStatistics(symbol, ticks, windowSize, nowMs = Date.now()) {
        const digits = sliceDigits(ticks, windowSize);
        const n = digits.length;
        const counts = Array(10).fill(0);
        for (const d of digits) counts[d] += 1;

        const expected = n * 0.1;
        let chiSquare = 0;
        if (n > 0 && expected > 0) {
          for (let d = 0; d < 10; d++) {
            chiSquare += Math.pow(counts[d] - expected, 2) / expected;
          }
        }
        chiSquare = Number(chiSquare.toFixed(4));

        // Approximation for chi-square p-value with df=9
        const pValue =
          n === 0
            ? 1
            : Number(Math.max(0.0001, Math.min(1, Math.exp(-0.5 * Math.max(0, chiSquare - 8.34)))).toFixed(4));

        let entropy = 0;
        if (n > 0) {
          for (let d = 0; d < 10; d++) {
            const p = counts[d] / n;
            if (p > 0) entropy -= p * Math.log2(p);
          }
        }
        const maxEntropy = Number(Math.log2(10).toFixed(4));
        const shannonEntropyBits = Number(entropy.toFixed(4));
        const normalizedEntropy = Number((shannonEntropyBits / maxEntropy).toFixed(4));
        const lag1Autocorrelation = computeAutocorrelation(digits, 1);
        const lag2Autocorrelation = computeAutocorrelation(digits, 2);
        const serialDependenceScore = Number(
          Math.min(1, (Math.abs(lag1Autocorrelation) + Math.abs(lag2Autocorrelation)) / 2).toFixed(4)
        );

        return {
          symbol,
          windowSize,
          sampleSize: n,
          chiSquareStatistic: chiSquare,
          pValue,
          shannonEntropyBits,
          maxEntropyBits: maxEntropy,
          normalizedEntropy,
          lag1Autocorrelation,
          lag2Autocorrelation,
          serialDependenceScore,
          multipleTestingWarning:
            "Multiple-testing warning: scanning 10 digits across windows increases false positives; statistical unusualness is not guaranteed predictability.",
          computedAt: nowMs,
        };
      }

      // =========================================================================
      // STAGE 5: MATCHES & DIFFERS + SIGNAL ENGINE (WITH EXPLICIT NO SIGNAL)
      // =========================================================================
      function evaluateMatchesAndDiffers(symbol, ticks, opts) {
        const digits = sliceDigits(ticks, opts.windowSize);
        const n = digits.length;
        const mode = opts.mode || "MATCHES";
        const targetDigit = opts.targetDigit ?? 0;
        const minSample = opts.minimumSampleSize ?? 30;
        const sensitivity = opts.sensitivity ?? 1.0;

        const matchesCount = digits.filter((d) => d === targetDigit).length;
        const differsCount = Math.max(0, n - matchesCount);
        const uniformBaselineProb = mode === "MATCHES" ? 0.1 : 0.9;
        const observedModeProb =
          n > 0 ? Number(((mode === "MATCHES" ? matchesCount : differsCount) / n).toFixed(4)) : 0;
        const ci = wilsonCI(mode === "MATCHES" ? matchesCount : differsCount, n);

        const priorWeight = 20;
        const shrunk =
          n > 0
            ? ((mode === "MATCHES" ? matchesCount : differsCount) + priorWeight * uniformBaselineProb) /
              (n + priorWeight)
            : uniformBaselineProb;
        const estimatedProbability = Number(
          Math.max(0.001, Math.min(0.999, uniformBaselineProb + (shrunk - uniformBaselineProb) * sensitivity)).toFixed(4)
        );

        let condProb = null;
        if (digits.length >= 2) {
          const prev = digits[digits.length - 2];
          const fromPrev = [];
          for (let i = 0; i < digits.length - 1; i++) {
            if (digits[i] === prev) fromPrev.push(digits[i + 1]);
          }
          if (fromPrev.length > 0) {
            const pMatch = fromPrev.filter((x) => x === targetDigit).length / fromPrev.length;
            condProb = Number((mode === "MATCHES" ? pMatch : 1 - pMatch).toFixed(4));
          }
        }

        const historicalConsistency = n >= 12 ? 0.75 : 0.2;
        const modelReliability = Number(
          (Math.min(1, n / Math.max(10, minSample * 2)) * 0.5 + historicalConsistency * 0.5).toFixed(3)
        );

        return {
          symbol,
          mode,
          targetDigit,
          sampleSize: n,
          uniformMatchesBaselinePct: 10,
          uniformDiffersBaselinePct: 90,
          selectedCandidate: {
            digit: targetDigit,
            observedModeProb,
            uniformBaselineProb,
            estimatedProbability,
            confidenceInterval: ci,
            conditionalTransitionProb: condProb,
            historicalConsistency,
            modelReliability,
            rank: 1,
          },
          statisticalCaveat:
            "Matches (10% uniform) and Differs (90% uniform) show historical sample proportions and confidence intervals—never guaranteed predictions.",
        };
      }

      function evaluateSignal(inputs, cfg = {}) {
        const minScore = cfg.minimumScoreForSignal ?? 55;
        const minSample = cfg.minimumSampleSize ?? 30;
        const sensitivity = cfg.sensitivity ?? 1.0;
        const nowMs = inputs.nowMs ?? Date.now();
        const digits = sliceDigits(inputs.ticks, inputs.windowSize);
        const n = digits.length;
        const latest = inputs.ticks && inputs.ticks.length > 0 ? inputs.ticks[inputs.ticks.length - 1] : null;
        const ageMs = latest ? Math.max(0, nowMs - latest.epochMs) : Infinity;

        const noSignalReasons = [];
        if (n === 0 || !latest) noSignalReasons.push("No tick observations in buffer.");
        else if (n < minSample) noSignalReasons.push(`Sample size (${n}) below minimum (${minSample} ticks).`);
        if (inputs.isFeedStale || ageMs > 15000) noSignalReasons.push("Market feed is stale or delayed.");

        const md = evaluateMatchesAndDiffers(inputs.symbol, inputs.ticks, {
          mode: inputs.mode,
          targetDigit: inputs.targetDigit,
          windowSize: inputs.windowSize,
          minimumSampleSize: minSample,
          sensitivity,
        });

        const cand = md.selectedCandidate;
        const freqScore = Math.max(0, Math.min(100, 50 + (cand.observedModeProb - cand.uniformBaselineProb) * 250 * sensitivity));
        const markovScore = Math.max(
          0,
          Math.min(100, 45 + ((cand.conditionalTransitionProb ?? cand.uniformBaselineProb) - cand.uniformBaselineProb) * 200 + inputs.markov.multiWindowConsistency * 20)
        );
        const consScore = Math.max(0, Math.min(100, cand.historicalConsistency * 100));
        const patScore = Math.max(
          0,
          Math.min(100, 40 + (n > 1 ? ((inputs.patterns.repeatedImmediateCount + inputs.patterns.alternatingPatternCount) / n) * 180 : 0))
        );
        const statScore = Math.max(0, Math.min(100, cand.modelReliability * 75 + (inputs.statistics.pValue <= 0.1 ? 15 : 0)));
        const dqScore = Math.max(0, Math.min(100, 100 - (inputs.isFeedStale ? 50 : 0) - (inputs.hasPrecisionWarning ? 20 : 0)));

        // Weights: 20% freq, 20% Markov, 15% consistency, 10% patterns, 20% stats, 15% data quality
        const score =
          n === 0
            ? 0
            : Number(
                (
                  freqScore * 0.2 +
                  markovScore * 0.2 +
                  consScore * 0.15 +
                  patScore * 0.1 +
                  statScore * 0.2 +
                  dqScore * 0.15
                ).toFixed(1)
              );

        if (noSignalReasons.length === 0 && score < minScore) {
          noSignalReasons.push(`Analytical score (${score}) below minimum threshold (${minScore}).`);
        }

        const isSignal = noSignalReasons.length === 0;
        const evidenceTier = !isSignal
          ? "INSUFFICIENT_EVIDENCE"
          : score >= 85
            ? "STRONG_EVIDENCE"
            : score >= 70
              ? "MODERATE_EVIDENCE"
              : score >= 55
                ? "WEAK_EVIDENCE"
                : "INSUFFICIENT_EVIDENCE";

        return {
          status: isSignal ? "SIGNAL" : "NO_SIGNAL",
          noSignalReasons,
          classification: isSignal ? inputs.mode : null,
          targetDigit: isSignal ? inputs.targetDigit : null,
          evidenceTier,
          analyticalScore: score,
          statisticalProbabilityEstimate: isSignal ? cand.estimatedProbability : null,
          sampleSize: n,
          symbol: inputs.symbol,
          supportingEvidence: [
            `${inputs.mode} on digit ${inputs.targetDigit}: ${(cand.observedModeProb * 100).toFixed(2)}% vs ${(cand.uniformBaselineProb * 100).toFixed(1)}% baseline (n=${n}).`,
            `Chi-square=${inputs.statistics.chiSquareStatistic} (p=${inputs.statistics.pValue}), Entropy=${inputs.statistics.shannonEntropyBits} bits.`,
          ],
          riskWarnings: [
            "Analytical evidence score quantifies historical sample structure—not guaranteed trade profitability.",
          ],
        };
      }

      // =========================================================================
      // STAGE 6: MULTI-MARKET SCANNER ENGINE
      // =========================================================================
      function runMultiMarketScan(buffers, opts, nowMs = Date.now()) {
        const rows = [];
        for (const [symbol, buf] of Object.entries(buffers)) {
          const ticks = buf?.ticks || [];
          const digits = sliceDigits(ticks, opts.windowSize);
          const freq = analyzeFrequency(symbol, ticks, opts.windowSize, nowMs);
          const markov = analyzeMarkov(symbol, ticks, opts.windowSize, nowMs);
          const patterns = analyzePatterns(symbol, ticks, opts.windowSize, nowMs);
          const statistics = runStatistics(symbol, ticks, opts.windowSize, nowMs);

          const maxDeviationPct = freq.digits.reduce((m, d) => Math.max(m, Math.abs(d.deviationPct)), 0);
          const mid = Math.floor(digits.length / 2);
          let shiftScore = 0;
          if (digits.length >= 10) {
            const a = digits.slice(0, mid);
            const b = digits.slice(mid);
            const cA = Array(10).fill(0);
            const cB = Array(10).fill(0);
            for (const x of a) cA[x] += 1;
            for (const x of b) cB[x] += 1;
            let l1 = 0;
            for (let d = 0; d < 10; d++) l1 += Math.abs(cA[d] / a.length - cB[d] / b.length);
            shiftScore = Number((0.5 * l1).toFixed(3));
          }

          const sig = evaluateSignal(
            {
              symbol,
              mode: opts.mode,
              targetDigit: opts.targetDigit ?? 0,
              windowSize: opts.windowSize,
              ticks,
              isFeedStale: Boolean(buf?.isStale),
              hasPrecisionWarning: Boolean(buf?.latestTick?.dataQualityWarning),
              markov,
              patterns,
              statistics,
              nowMs,
            },
            { minimumSampleSize: 30 }
          );

          const flags = [];
          if (buf?.isStale) flags.push("STALE_FEED");
          if (digits.length < 30) flags.push("INSUFFICIENT_SAMPLE");
          if (shiftScore >= 0.22) flags.push("DISTRIBUTION_SHIFT");
          if (sig.status === "NO_SIGNAL") flags.push("NO_SIGNAL");

          rows.push({
            symbol,
            sampleSize: digits.length,
            isStale: Boolean(buf?.isStale),
            hasInsufficientSample: digits.length < 30,
            maxDeviationPct: Number(maxDeviationPct.toFixed(1)),
            distributionShiftScore: shiftScore,
            analyticalScore: sig.analyticalScore,
            signalStatus: sig.status,
            statusFlags: flags,
          });
        }

        rows.sort((a, b) => {
          const healthyA = !a.isStale && !a.hasInsufficientSample ? 1 : 0;
          const healthyB = !b.isStale && !b.hasInsufficientSample ? 1 : 0;
          if (healthyB !== healthyA) return healthyB - healthyA;
          return b.analyticalScore - a.analyticalScore || b.maxDeviationPct - a.maxDeviationPct;
        });

        return {
          scannedAt: nowMs,
          rows: rows.map((r, i) => ({ ...r, rank: i + 1 })),
        };
      }

      // =========================================================================
      // STAGE 7: WALK-FORWARD BACKTEST ENGINE (ZERO LOOK-AHEAD BIAS)
      // =========================================================================
      function runWalkForwardBacktest(ticks, cfg) {
        const valid = (ticks || []).filter(
          (t) => t && typeof t.digit === "number" && Number.isInteger(t.digit) && t.digit >= 0 && t.digit <= 9
        );
        const minLookback = Math.max(10, cfg.minLookbackTicks ?? 30);
        const outcomes = [];

        for (let t = minLookback; t < valid.length; t++) {
          const priorTicks = valid.slice(0, t); // Strictly before t
          const targetTick = valid[t];
          const md = evaluateMatchesAndDiffers(cfg.symbol, priorTicks, {
            mode: cfg.mode,
            targetDigit: cfg.targetDigit,
            windowSize: cfg.windowSize,
            minimumSampleSize: minLookback,
            sensitivity: 1.0,
          });
          const markov = analyzeMarkov(cfg.symbol, priorTicks, cfg.windowSize, targetTick.epochMs);
          const patterns = analyzePatterns(cfg.symbol, priorTicks, cfg.windowSize, targetTick.epochMs);
          const statistics = runStatistics(cfg.symbol, priorTicks, cfg.windowSize, targetTick.epochMs);
          const sig = evaluateSignal(
            {
              symbol: cfg.symbol,
              mode: cfg.mode,
              targetDigit: cfg.targetDigit,
              windowSize: cfg.windowSize,
              ticks: priorTicks,
              isFeedStale: false,
              hasPrecisionWarning: false,
              markov,
              patterns,
              statistics,
              nowMs: targetTick.epochMs,
            },
            { minimumSampleSize: minLookback }
          );

          const actualOutcome =
            cfg.mode === "MATCHES" ? targetTick.digit === cfg.targetDigit : targetTick.digit !== cfg.targetDigit;
          const p = Math.max(1e-6, Math.min(1 - 1e-6, md.selectedCandidate.estimatedProbability));
          const y = actualOutcome ? 1 : 0;

          outcomes.push({
            actualOutcome,
            predictedProbability: p,
            y,
            signalEmitted: sig.status === "SIGNAL",
            hit: sig.status === "SIGNAL" ? actualOutcome : null,
          });
        }

        const oosStart = Math.floor(outcomes.length * 0.7);
        const summarize = (list) => {
          if (list.length === 0) {
            return { totalObservations: 0, totalAnalyticalSignals: 0, overallSignalHitRate: 0, brierScore: 0, logLoss: 0, maxConsecutiveMisses: 0 };
          }
          let signals = 0;
          let hits = 0;
          let brierSum = 0;
          let logLossSum = 0;
          let misses = 0;
          let maxMisses = 0;
          for (const item of list) {
            brierSum += Math.pow(item.predictedProbability - item.y, 2);
            logLossSum += -(item.y * Math.log(item.predictedProbability) + (1 - item.y) * Math.log(1 - item.predictedProbability));
            if (item.signalEmitted) {
              signals += 1;
              if (item.hit) {
                hits += 1;
                misses = 0;
              } else {
                misses += 1;
                if (misses > maxMisses) maxMisses = misses;
              }
            }
          }
          return {
            totalObservations: list.length,
            totalAnalyticalSignals: signals,
            overallSignalHitRate: signals > 0 ? Number((hits / signals).toFixed(4)) : 0,
            brierScore: Number((brierSum / list.length).toFixed(4)),
            logLoss: Number((logLossSum / list.length).toFixed(4)),
            maxConsecutiveMisses: maxMisses,
          };
        };

        return {
          combined: summarize(outcomes),
          outOfSample: summarize(outcomes.slice(oosStart)),
          uniformBaselineRate: cfg.mode === "MATCHES" ? 0.1 : 0.9,
          disclaimer:
            "Strict no-look-ahead evaluation using ticks[0..t-1]. Hit rate, Brier score, and log loss measure statistical accuracy—not actual trading profit.",
        };
      }

      // =========================================================================
      // STAGE 8: ISOLATED SIMULATION ENGINE & TERMINAL UI
      // =========================================================================
      class IsolatedSimulationEngine {
        constructor() {
          this.epochMs = Date.now();
          this.counter = 0;
          this.prices = new Map(INITIAL_SYMBOLS.map((s, idx) => [s, 1000 + idx * 111.25]));
        }
        generateBatch(count, symbols, pipSize = 0.01) {
          const list = symbols && symbols.length > 0 ? symbols : INITIAL_SYMBOLS;
          const out = [];
          for (let i = 0; i < count; i++) {
            this.counter += 1;
            this.epochMs += 1000;
            const sym = list[this.counter % list.length];
            const prev = this.prices.get(sym) ?? 1000;
            const digit = Math.floor(Math.random() * 10);
            const delta = (Math.random() < 0.5 ? -1 : 1) * (1 + Math.floor(Math.random() * 9)) * pipSize;
            const rawNum = Math.max(1, prev + delta).toFixed(2);
            const quoteStr = `${rawNum.slice(0, -1)}${digit}`;
            const quoteNum = Number(quoteStr);
            this.prices.set(sym, quoteNum);
            out.push({
              symbol: sym,
              quoteStr,
              quoteNum,
              digit,
              epochMs: this.epochMs,
              tickId: `sim_${this.counter}_${this.epochMs}`,
              dataQualityWarning: "SIMULATED_FEED — Not real Deriv market data",
            });
          }
          return out;
        }
      }

      function App() {
        const [connState, setConnState] = useState("DISCONNECTED");
        const [feedMode, setFeedMode] = useState("LIVE_PUBLIC");
        const [appId, setAppId] = useState(DEFAULT_APP_ID);
        const [reconnectAttempts, setReconnectAttempts] = useState(0);
        const [rttMs, setRttMs] = useState(null);
        const [lastError, setLastError] = useState(null);
        const [diagnostics, setDiagnostics] = useState([]);

        const [simulationActive, setSimulationActive] = useState(false);
        const [activeSymbol, setActiveSymbol] = useState("1HZ100V");
        const [availableSymbols, setAvailableSymbols] = useState([]);
        const [maxBufferSize, setMaxBufferSize] = useState(2000);
        const [buffers, setBuffers] = useState(() => {
          const init = {};
          for (const s of INITIAL_SYMBOLS) {
            init[s] = {
              symbol: s,

              duplicateTicksDropped: 0,

              isStale: false,
            };

        });

        const [windowSize, setWindowSize] = useState(100);
        const [mode, setMode] = useState("MATCHES");
        const [targetDigit, setTargetDigit] = useState(0);
        const [minimumSampleSize, setMinimumSampleSize] = useState(30);
        const [sensitivity, setSensitivity] = useState(1.0);
        const [minSignalScore, setMinSignalScore] = useState(55);

        // Scanner state (12s default)
        const [autoScanEnabled, setAutoScanEnabled] = useState(true);
        const [scanIntervalMs, setScanIntervalMs] = useState(DEFAULT_SCANNER_INTERVAL_MS);
        const [remainingMs, setRemainingMs] = useState(DEFAULT_SCANNER_INTERVAL_MS);
        const [scanHistory, setScanHistory] = useState([]);
        const [rankedMarkets, setRankedMarkets] = useState([]);

        // Backtest & UI filter state
        const [backtestReport, setBacktestReport] = useState(null);
        const [lookbackTicks, setLookbackTicks] = useState(30);
        const [symbolSearch, setSymbolSearch] = useState("");
        const [categoryFilter, setCategoryFilter] = useState("ALL");

        const wsRef = useRef(null);
        const manualDisconnectRef = useRef(false);
        const reconnectTimerRef = useRef(null);
        const heartbeatTimerRef = useRef(null);
        const pingSentAtRef = useRef(null);
        const pendingReqRef = useRef(new Map());
        const reqSeqRef = useRef(0);
        const subMapRef = useRef(new Map()); // symbol -> subId
        const simRef = useRef(new IsolatedSimulationEngine());
        const buffersRef = useRef(buffers);
        buffersRef.current = buffers;

        const endpoint =
          feedMode === "LEGACY_ADAPTER" ? `${LEGACY_V3_WS_BASE}?app_id=${appId}` : PUBLIC_OPTIONS_WS;

        const pushDiag = useCallback((level, code, message) => {
          setDiagnostics((prev) => [
            ...prev.slice(-79),
            { id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, timestamp: Date.now(), level, code, message },
          ]);
        }, []);

        const ingestTick = useCallback((tick, nowMs = Date.now()) => {
          if (!tick || typeof tick.digit !== "number" || tick.digit < 0 || tick.digit > 9) return;
          setBuffers((prev) => {
            const cur = prev[tick.symbol] || {
              symbol: tick.symbol,
              ticks: [],
              latestTick: null,
              duplicateTicksDropped: 0,
              invalidTicksRejected: 0,
              outOfOrderTicksCount: 0,
              isStale: false,
            };
            const latest = cur.latestTick;
            if (latest) {
              if ((tick.tickId && latest.tickId && tick.tickId === latest.tickId) || (latest.epochMs === tick.epochMs && latest.quoteStr === tick.quoteStr)) {
                return { ...prev, [tick.symbol]: { ...cur, duplicateTicksDropped: cur.duplicateTicksDropped + 1 } };
              }
              if (tick.epochMs < latest.epochMs) {
                return { ...prev, [tick.symbol]: { ...cur, outOfOrderTicksCount: cur.outOfOrderTicksCount + 1 } };
              }
            }
            const nextTicks =
              cur.ticks.length >= maxBufferSize
                ? [...cur.ticks.slice(cur.ticks.length - maxBufferSize + 1), tick]
                : [...cur.ticks, tick];
            return {
              ...prev,
              [tick.symbol]: {
                ...cur,
                ticks: nextTicks,
                latestTick: tick,
                isStale: nowMs - tick.epochMs > STALE_THRESHOLD_MS,
              },
            };
          });
        }, [maxBufferSize]);

        const sendRequest = useCallback((payload, method = "req") => {
          return new Promise((resolve, reject) => {
            const sock = wsRef.current;
            if (!sock || sock.readyState !== 1) {
              reject(new Error(`Socket not connected for ${method}`));
              return;
            }
            const reqId = `dq_${++reqSeqRef.current}_${Date.now()}`;
            const timer = setTimeout(() => {
              pendingReqRef.current.delete(reqId);
              reject(new Error(`Timeout on ${method}`));
            }, 12000);
            pendingReqRef.current.set(reqId, { resolve, reject, timer });
            sock.send(JSON.stringify({ ...payload, req_id: reqId }));
          });
        }, []);

        const subscribeSymbol = useCallback(async (sym) => {
          if (!wsRef.current || wsRef.current.readyState !== 1) return;
          try {
            const res = await sendRequest({ ticks: sym, subscribe: 1 }, `ticks:${sym}`);
            if (res?.subscription?.id) {
              subMapRef.current.set(sym, res.subscription.id);
            }
          } catch (e) {
            pushDiag("warn", "SUB_ERR", e.message);
          }
        }, [pushDiag, sendRequest]);

        const unsubscribeSymbol = useCallback(async (sym) => {
          const subId = subMapRef.current.get(sym);
          subMapRef.current.delete(sym);
          if (subId && wsRef.current && wsRef.current.readyState === 1) {
            try {
              await sendRequest({ forget: subId }, `forget:${sym}`);
            } catch {
              // ignore cleanup timeout
            }
          }
        }, [sendRequest]);

        const discoverSymbols = useCallback(async () => {
          try {
            const res = await sendRequest({ active_symbols: "brief" }, "active_symbols");
            const list = normalizeSymbols(res);
            if (list.length > 0) {
              setAvailableSymbols(list);
              pushDiag("info", "SYMBOLS_OK", `Discovered ${list.length} active symbols.`);
            }
          } catch (e) {
            pushDiag("warn", "SYMBOLS_ERR", e.message);
          }
        }, [pushDiag, sendRequest]);

        const openSocket = useCallback((isReconnect = false) => {
          if (wsRef.current) {
            try { wsRef.current.close(1000, "Reset"); } catch {}
            wsRef.current = null;
          }
          setConnState(isReconnect ? "RECONNECTING" : "CONNECTING");
          setLastError(null);

          const sock = new WebSocket(endpoint);
          wsRef.current = sock;

          const connectTimer = setTimeout(() => {
            if (wsRef.current === sock && sock.readyState !== 1) {
              setConnState("ERROR");
              setLastError("Connection timed out");
              pushDiag("error", "CONNECT_TIMEOUT", "WebSocket connection attempt timed out.");
              sock.close();
            }
          }, 10000);

          sock.addEventListener("open", async () => {
            clearTimeout(connectTimer);
            setConnState("CONNECTED");
            setReconnectAttempts(0);
            pushDiag("info", "WS_OPEN", `Connected to ${endpoint}`);

            clearInterval(heartbeatTimerRef.current);
            heartbeatTimerRef.current = setInterval(() => {
              if (sock.readyState === 1) {
                pingSentAtRef.current = Date.now();
                sock.send(JSON.stringify({ ping: 1, req_id: `ping_${Date.now()}` }));
              }
            }, 25000);

            if (isReconnect) {
              const previousSubs = Array.from(subMapRef.current.keys());
              subMapRef.current.clear();
              for (const s of previousSubs) await subscribeSymbol(s);
            } else {
              await discoverSymbols();
              await subscribeSymbol(activeSymbol);
            }
          });

          sock.addEventListener("message", (ev) => {
            let msg;
            try {
              msg = JSON.parse(String(ev.data));
            } catch {
              pushDiag("warn", "MALFORMED_JSON", "Dropped non-JSON WebSocket frame.");
              return;
            }
            if (!msg || typeof msg !== "object") return;

            if (msg.pong !== undefined) {
              if (pingSentAtRef.current !== null) {
                setRttMs(Math.max(1, Date.now() - pingSentAtRef.current));
                pingSentAtRef.current = null;
              }
            }

            if (msg.req_id && pendingReqRef.current.has(String(msg.req_id))) {
              const entry = pendingReqRef.current.get(String(msg.req_id));
              clearTimeout(entry.timer);
              pendingReqRef.current.delete(String(msg.req_id));
              if (msg.error) entry.reject(new Error(msg.error.message || "API error"));
              else entry.resolve(msg);
            }

            if (msg.tick) {
              const sym = msg.tick.symbol || activeSymbol;
              const meta = availableSymbols.find((x) => x.symbol === sym);
              const parsed = parseInboundTick(msg, meta, sym);
              if (parsed) ingestTick(parsed);
            }
          });

          sock.addEventListener("close", () => {
            clearTimeout(connectTimer);
            clearInterval(heartbeatTimerRef.current);
            for (const [, p] of pendingReqRef.current.entries()) {
              clearTimeout(p.timer);
              p.reject(new Error("Socket closed"));
            }
            pendingReqRef.current.clear();

            if (manualDisconnectRef.current) {
              setConnState("DISCONNECTED");
              pushDiag("info", "WS_CLOSED", "Disconnected by user.");
              return;
            }

            setReconnectAttempts((prev) => {
              const next = prev + 1;
              if (next > 12) {
                setConnState("ERROR");
                setLastError("Max reconnection attempts exceeded.");
                pushDiag("error", "MAX_RETRY", "Stopped reconnecting after 12 attempts.");
                return prev;
              }
              const delay = computeBackoffMs(next - 1);
              setConnState("RECONNECTING");
              pushDiag("info", "RECONNECT", `Reconnect attempt ${next} in ${delay}ms.`);
              reconnectTimerRef.current = setTimeout(() => openSocket(true), delay);
              return next;
            });
          });

          sock.addEventListener("error", () => {
            pushDiag("error", "WS_ERROR", "WebSocket transport error occurred.");
          });
        }, [activeSymbol, availableSymbols, discoverSymbols, endpoint, ingestTick, pushDiag, subscribeSymbol]);

        const connectFeed = useCallback(() => {
          setSimulationActive(false);
          manualDisconnectRef.current = false;
          openSocket(false);
        }, [openSocket]);

        const disconnectFeed = useCallback(() => {
          manualDisconnectRef.current = true;
          clearTimeout(reconnectTimerRef.current);
          clearInterval(heartbeatTimerRef.current);
          if (wsRef.current) {
            try { wsRef.current.close(1000, "User disconnect"); } catch {}
          }
          setConnState("DISCONNECTED");
        }, []);

        useEffect(() => {
          return () => {
            manualDisconnectRef.current = true;
            clearTimeout(reconnectTimerRef.current);
            clearInterval(heartbeatTimerRef.current);
            if (wsRef.current) {
              try { wsRef.current.close(1000, "Unmount"); } catch {}
            }
          };
        }, []);

        // Simulation loop (strictly isolated from live WebSocket)
        useEffect(() => {
          if (!simulationActive) return;
          const seed = simRef.current.generateBatch(45, [activeSymbol], 0.01);
          for (const t of seed) ingestTick(t);
          const id = setInterval(() => {
            const next = simRef.current.generateBatch(1, [activeSymbol], 0.01);
            for (const t of next) ingestTick(t);
          }, 1000);
          return () => clearInterval(id);
        }, [simulationActive, activeSymbol, ingestTick]);

        // Scanner loop (12s default, non-blocking)
        const triggerManualScan = useCallback(() => {
          queueMicrotask(() => {
            const snap = runMultiMarketScan(buffersRef.current, {
              windowSize,
              mode,
              targetDigit,
            });
            setRankedMarkets(snap.rows);
            setScanHistory((prev) => [snap, ...prev].slice(0, 25));
            setRemainingMs(scanIntervalMs);
          });
        }, [mode, targetDigit, windowSize, scanIntervalMs]);

        useEffect(() => {
          if (!autoScanEnabled) return;
          const stepMs = 500;
          const timer = setInterval(() => {
            setRemainingMs((prev) => {
              if (prev - stepMs <= 0) {
                triggerManualScan();
                return scanIntervalMs;
              }
              return prev - stepMs;
            });
          }, stepMs);
          return () => clearInterval(timer);
        }, [autoScanEnabled, scanIntervalMs, triggerManualScan]);

        const handleSelectSymbol = useCallback(async (nextSym) => {
          const prevSym = activeSymbol;
          setActiveSymbol(nextSym);
          setBuffers((prev) =>
            prev[nextSym]
              ? prev
              : {
                  ...prev,
                  [nextSym]: {
                    symbol: nextSym,
                    ticks: [],
                    latestTick: null,
                    duplicateTicksDropped: 0,
                    invalidTicksRejected: 0,
                    outOfOrderTicksCount: 0,
                    isStale: false,
                  },
                }
          );
          if (wsRef.current && wsRef.current.readyState === 1 && prevSym !== nextSym) {
            await unsubscribeSymbol(prevSym);
            await subscribeSymbol(nextSym);
          }
        }, [activeSymbol, subscribeSymbol, unsubscribeSymbol]);

        const activeBuffer = buffers[activeSymbol] || null;
        const activeMeta = useMemo(
          () => availableSymbols.find((s) => s.symbol === activeSymbol),
          [availableSymbols, activeSymbol]
        );
        const ticks = activeBuffer?.ticks || [];

        const frequency = useMemo(() => analyzeFrequency(activeSymbol, ticks, windowSize), [activeSymbol, ticks, windowSize]);
        const markov = useMemo(() => analyzeMarkov(activeSymbol, ticks, windowSize), [activeSymbol, ticks, windowSize]);
        const patterns = useMemo(() => analyzePatterns(activeSymbol, ticks, windowSize), [activeSymbol, ticks, windowSize]);
        const statistics = useMemo(() => runStatistics(activeSymbol, ticks, windowSize), [activeSymbol, ticks, windowSize]);
        const matchDiffer = useMemo(
          () =>
            evaluateMatchesAndDiffers(activeSymbol, ticks, {
              mode,
              targetDigit,
              windowSize,
              minimumSampleSize,
              sensitivity,
            }),
          [activeSymbol, ticks, mode, targetDigit, windowSize, minimumSampleSize, sensitivity]
        );
        const signal = useMemo(
          () =>
            evaluateSignal(
              {
                symbol: activeSymbol,
                mode,
                targetDigit,
                windowSize,
                ticks,
                isFeedStale: Boolean(activeBuffer?.isStale),
                hasPrecisionWarning: Boolean(activeMeta?.hasPrecisionWarning || activeBuffer?.latestTick?.dataQualityWarning),
                markov,
                patterns,
                statistics,
              },
              { minimumScoreForSignal: minSignalScore, minimumSampleSize, sensitivity }
            ),
          [activeSymbol, mode, targetDigit, windowSize, ticks, activeBuffer, activeMeta, markov, patterns, statistics, minSignalScore, minimumSampleSize, sensitivity]
        );
